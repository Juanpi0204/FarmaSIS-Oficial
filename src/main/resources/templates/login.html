<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestión farmacéutica L-Farma. Acceso exclusivo para personal autorizado.">
    <title>Iniciar Sesión - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1B4332;
            --primary-light: #2D6A4F;
            --secondary-color: #52B788;
            --accent-color: #74C69D;
            --accent-light: #B7E4C7;
            --dark-bg: #081C15;
        }

        * {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-color) 40%, var(--primary-light) 70%, var(--secondary-color) 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 1.25rem;
        }

        /* Subtle animated dots background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
        }

        .login-card {
            width: 100%;
            max-width: 355px;
            padding: 1.9rem 1.85rem;
            border-radius: 18px;
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(0, 0, 0, 0.15);
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.45);
            animation: slideUp 0.5s ease-out;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 1.45rem;
        }

        .brand-logo .logo-icon {
            font-size: 2.35rem;
            color: var(--secondary-color);
            display: block;
            margin-bottom: 4px;
            line-height: 1.1;
        }

        .brand-logo h1 {
            font-size: 1.48rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
            letter-spacing: 0.3px;
        }

        .brand-logo p {
            font-size: 0.78rem;
            color: #6c757d;
            margin: 3px 0 0;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
            font-size: 0.8rem;
            margin-bottom: 0.35rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 9px 13px;
            border: 1.5px solid #dee2e6;
            font-size: 0.86rem;
            transition: all 0.25s;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.2rem rgba(82, 183, 136, 0.18);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            border: none;
            color: white;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            transition: all 0.25s;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--secondary-color) 100%);
            color: white;
            transform: translateY(-1.5px);
            box-shadow: 0 6px 20px rgba(27, 67, 50, 0.28);
        }

        .footer-text {
            text-align: center;
            margin-top: 1.25rem;
            padding-top: 0.85rem;
            border-top: 1px solid #f0f0f0;
        }

        .footer-text small {
            color: #adb5bd;
            font-size: 0.73rem;
        }

        .footer-text strong {
            color: var(--secondary-color);
        }

        .alert {
            border-radius: 10px;
            border: none;
            font-size: 0.8rem;
            padding: 0.65rem 0.85rem;
        }

        .input-group-text {
            background: transparent;
            border-radius: 0 10px 10px 0;
            border: 1.5px solid #dee2e6;
            border-left: none;
            cursor: pointer;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .input-group .form-control {
            border-right: none;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--secondary-color);
        }

        @media (max-width: 576px) {
            body {
                padding: 1rem 0.85rem;
            }
            .login-card {
                max-width: 335px;
                padding: 1.6rem 1.4rem;
                border-radius: 16px;
            }
            .form-control {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-logo">
            <i class="bi bi-heart-pulse logo-icon"></i>
            <h1>L-Farma</h1>
            <p>Sistema de Gestión Farmacéutica</p>
        </div>

        <!-- Mensajes de error o éxito -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i> Usuario o contraseña incorrectos.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-1"></i> Has cerrado sesión correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder="correo@ejemplo.com" required autofocus>
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="••••••••" required>
                    <span class="input-group-text" onclick="togglePassword()"><i class="bi bi-eye" id="toggleIcon"></i></span>
                </div>
            </div>
            <div class="d-grid gap-2 mt-3">
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </button>
            </div>
        </form>
        <div class="footer-text">
            <small>Desarrollado por <strong>Farmasis</strong> © 2026</small>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</body>

</html>

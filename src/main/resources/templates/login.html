<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de gestión farmacéutica L-Farma. Acceso exclusivo para personal autorizado.">
    <title>Iniciar Sesión - L-Farma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #133A29;
            --primary-light: #1E6043;
            --secondary-color: #10B981;
            --accent-color: #34D399;
            --accent-light: #A7F3D0;
            --dark-bg: #05130D;
        }

        /* Escala ejecutiva al 80% automática en escritorio para máxima nitidez al 100% de Chrome */
        @media (min-width: 769px) {
            html {
                font-size: 13.2px;
            }
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            background:
                radial-gradient(circle at 22% 22%, rgba(52, 211, 153, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 80% 78%, rgba(16, 185, 129, 0.22) 0%, transparent 50%),
                linear-gradient(135deg, #05130D 0%, #0F2E20 35%, #1B4D36 68%, #2D7A56 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 1.25rem;
        }

        /* Malla de puntos de alta definición */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        .login-card {
            width: 100%;
            max-width: 335px;
            padding: 2rem 1.85rem;
            border-radius: 18px;
            background: linear-gradient(180deg, #FFFFFF 0%, #F9FCFA 100%);
            border: 1px solid rgba(167, 243, 208, 0.55);
            box-shadow:
                0 25px 55px -12px rgba(3, 12, 8, 0.55),
                0 8px 20px -6px rgba(16, 185, 129, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            margin: auto;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo .logo-icon {
            font-size: 2.55rem;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 10px rgba(16, 185, 129, 0.25));
            display: inline-block;
            margin-bottom: 4px;
            line-height: 1.1;
        }

        .brand-logo h1 {
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 0;
            letter-spacing: -0.3px;
        }

        .brand-logo p {
            font-size: 0.82rem;
            color: #64748b;
            font-weight: 500;
            margin: 3px 0 0;
        }

        .form-label {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.82rem;
            margin-bottom: 0.38rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 9.5px 13px;
            border: 1.5px solid #e2e8f0;
            background-color: #f8fafc;
            color: #0f172a;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.22s ease;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-login {
            background: linear-gradient(135deg, #133A29 0%, #1E6043 55%, #10B981 100%);
            border: 1px solid rgba(52, 211, 153, 0.45);
            color: white;
            border-radius: 10px;
            padding: 10.5px 14px;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.25px;
            box-shadow:
                0 6px 16px rgba(19, 58, 41, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: all 0.25s ease;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #184934 0%, #247350 50%, #10B981 100%);
            color: white;
            transform: translateY(-1.5px);
            box-shadow:
                0 10px 22px rgba(16, 185, 129, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .footer-text {
            text-align: center;
            margin-top: 1.35rem;
            padding-top: 0.9rem;
            border-top: 1px solid #f1f5f9;
        }

        .footer-text small {
            color: #94a3b8;
            font-size: 0.76rem;
            font-weight: 500;
        }

        .footer-text strong {
            color: #059669;
            font-weight: 700;
        }

        .alert {
            border-radius: 10px;
            border: none;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 0.65rem 0.85rem;
        }

        .input-group-text {
            background-color: #f8fafc;
            border-radius: 0 10px 10px 0;
            border: 1.5px solid #e2e8f0;
            border-left: none;
            cursor: pointer;
            color: #64748b;
            font-size: 0.95rem;
            transition: all 0.22s ease;
        }

        .input-group .form-control {
            border-right: none;
        }

        .input-group:focus-within .input-group-text {
            background-color: #ffffff;
            border-color: var(--secondary-color);
            color: var(--secondary-color);
        }

        @media (max-width: 576px) {
            body {
                padding: 1rem 0.85rem;
            }
            .login-card {
                max-width: 330px;
                padding: 1.65rem 1.45rem;
                border-radius: 16px;
            }
            .form-control {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-logo">
            <i class="bi bi-heart-pulse logo-icon"></i>
            <h1>L-Farma</h1>
            <p>Sistema de Gestión Farmacéutica</p>
        </div>

        <!-- Mensajes de error o éxito -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle me-1"></i> Usuario o contraseña incorrectos.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-1"></i> Has cerrado sesión correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder="correo@ejemplo.com" required autofocus>
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="••••••••" required>
                    <span class="input-group-text" onclick="togglePassword()"><i class="bi bi-eye" id="toggleIcon"></i></span>
                </div>
            </div>
            <div class="d-grid gap-2 mt-3">
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </button>
            </div>
        </form>
        <div class="footer-text">
            <small>Desarrollado por <strong>Farmasis</strong> © 2026</small>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</body>

</html>

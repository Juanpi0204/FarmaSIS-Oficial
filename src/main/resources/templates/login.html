<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="FarmaSIS - Control Total & BI. Acceso Ejecutivo para personal autorizado.">
    <title>FarmaSIS — Acceso Ejecutivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald-deep: #1B4332;
            --emerald-mid: #2D6A4F;
            --emerald-bright: #198754;
            --emerald-top: #40916C;
            --emerald-mint: #95D5B2;
            --emerald-border: #74C69D;
            --surface-input: #F8FAFC;
            --border-chrome-subtle: #E2E8F0;
            --border-chrome-bright: #CBD5E1;
            --text-silver-bright: #0F172A;
            --text-silver: #334155;
            --text-steel: #64748B;
            --text-muted: #94A3B8;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 1.5rem 1.25rem;
            /* Gradiente brillante idéntico al Login Ejecutivo FarmaSIS (Esmeralda profundo -> Esmeralda vivo -> Plata Esmeralda luminoso) */
            background:
                radial-gradient(circle at 20% 20%, rgba(116, 198, 157, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.35) 0%, transparent 50%),
                linear-gradient(135deg, #143628 0%, #1B4332 22%, #2D6A4F 52%, #74C69D 85%, #CCE2D8 100%);
            background-attachment: fixed;
        }

        /* Destello sutil de malla de alta definición */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 26px 26px;
            pointer-events: none;
            z-index: 0;
        }

        .login-shell {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            margin: auto;
            animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CABECERA SUPERIOR EN CROMO, PLATA Y ESMERALDA 3D */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 1.5rem;
        }

        .metallic-cross-logo {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            background: #FFFFFF;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow:
                0 10px 25px rgba(15, 23, 42, 0.22),
                0 2px 6px rgba(15, 23, 42, 0.12),
                inset 0 1px 2px rgba(255, 255, 255, 0.9);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .metallic-cross-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-titles {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand-name {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.08;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.18);
        }

        .brand-name .farma {
            color: #FFFFFF;
        }

        .brand-name .sis {
            color: var(--emerald-mint);
        }

        .brand-subtitle {
            font-size: 0.86rem;
            color: #D8F3DC;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin: 2px 0 0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        /* TARJETA GLASSMORPHISM METÁLICA (BLANCO PERLA Y PLATA ESMERALDA) */
        .metallic-glass-card {
            width: 100%;
            padding: 1.75rem 1.65rem;
            border-radius: 20px;
            background: linear-gradient(145deg, #FFFFFF 0%, #FAFCFE 100%);
            border: 1.2px solid rgba(255, 255, 255, 0.95);
            box-shadow:
                0 24px 55px rgba(8, 28, 21, 0.32),
                0 6px 18px rgba(15, 23, 42, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 1);
            position: relative;
        }

        .card-heading {
            font-size: 1.18rem;
            font-weight: 800;
            color: var(--text-silver-bright);
            margin: 0 0 3px 0;
            letter-spacing: -0.2px;
        }

        .card-subheading {
            font-size: 0.8rem;
            color: var(--text-steel);
            font-weight: 500;
            margin: 0 0 1.25rem 0;
        }

        .field-label {
            display: block;
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--text-silver);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .leading-icon {
            position: absolute;
            left: 14px;
            color: var(--emerald-bright);
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 2;
        }

        .input-wrapper .trailing-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-steel);
            font-size: 1.05rem;
            padding: 4px 6px;
            cursor: pointer;
            z-index: 2;
            border-radius: 8px;
            transition: color 0.2s, background-color 0.2s;
        }

        .input-wrapper .trailing-btn:hover {
            color: var(--emerald-deep);
            background-color: rgba(15, 23, 42, 0.04);
        }

        .executive-input {
            width: 100%;
            background-color: var(--surface-input);
            border: 1.2px solid var(--border-chrome-subtle);
            border-radius: 12px;
            padding: 12px 40px 12px 42px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-silver-bright);
            transition: all 0.2s ease;
            outline: none;
        }

        .executive-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .executive-input:focus {
            background-color: #FFFFFF;
            border-color: var(--emerald-bright);
            border-width: 1.5px;
            box-shadow: 0 0 0 3.5px rgba(25, 135, 84, 0.14);
        }

        /* BOTÓN METÁLICO 3D VERDE FARMASIS */
        .btn-metallic-emerald {
            width: 100%;
            height: 48px;
            background: linear-gradient(180deg, #40916C 0%, #2D6A4F 50%, #1B4332 100%);
            border: 1.2px solid #74C69D;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 0.94rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow:
                0 6px 16px rgba(27, 67, 50, 0.28),
                inset 0 1px 1px rgba(255, 255, 255, 0.35);
            transition: all 0.22s ease;
        }

        .btn-metallic-emerald:hover {
            background: linear-gradient(180deg, #52B788 0%, #347C5B 50%, #21523D 100%);
            transform: translateY(-1.5px);
            box-shadow:
                0 10px 22px rgba(27, 67, 50, 0.36),
                inset 0 1px 1px rgba(255, 255, 255, 0.45);
            color: #FFFFFF;
        }

        .btn-metallic-emerald:active {
            transform: translateY(0);
        }

        /* ALERTAS EJECUTIVAS */
        .executive-alert {
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .executive-alert-danger {
            background-color: #FFF1F2;
            border: 1px solid rgba(220, 38, 38, 0.45);
            color: #9F1239;
        }

        .executive-alert-success {
            background-color: #F0FDF4;
            border: 1px solid rgba(25, 135, 84, 0.45);
            color: #166534;
        }

        .footer-badge {
            margin-top: 1.15rem;
            padding-top: 0.9rem;
            border-top: 1px solid var(--border-chrome-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-steel);
            font-weight: 500;
        }

        .footer-badge strong {
            color: var(--emerald-bright);
            font-weight: 700;
        }

        /* RESPONSIVE PARA CELULARES */
        @media (max-width: 576px) {
            body {
                padding: 1rem 0.9rem;
            }
            .brand-header {
                margin-bottom: 1.15rem;
                gap: 11px;
            }
            .metallic-cross-logo {
                width: 52px;
                height: 52px;
                border-radius: 13px;
            }
            .brand-name {
                font-size: 1.65rem;
            }
            .brand-subtitle {
                font-size: 0.8rem;
            }
            .metallic-glass-card {
                padding: 1.4rem 1.25rem;
                border-radius: 18px;
            }
            .executive-input {
                font-size: 16px; /* Evita auto-zoom en iOS y Android */
                padding: 11px 38px 11px 40px;
            }
            .btn-metallic-emerald {
                height: 46px;
                font-size: 0.92rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-shell">
        <!-- BRANDING SUPERIOR EN CROMO, PLATA Y ESMERALDA 3D -->
        <div class="brand-header">
            <div class="metallic-cross-logo">
                <img src="/images/farmasis_logo.png" alt="FarmaSIS Logo"
                     onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'bi bi-heart-pulse\' style=\'font-size:1.8rem;color:#198754;\'></i>';">
            </div>
            <div class="brand-titles">
                <h1 class="brand-name"><span class="farma">Farma</span><span class="sis">SIS</span></h1>
                <p class="brand-subtitle">Control Total &amp; BI</p>
            </div>
        </div>

        <!-- TARJETA GLASSMORPHISM METÁLICA (BLANCO PERLA Y PLATA ESMERALDA) -->
        <div class="metallic-glass-card">
            <h2 class="card-heading">Acceso Ejecutivo</h2>
            <p class="card-subheading">Ingresa tus credenciales autorizadas</p>

            <!-- Mensajes de error o éxito -->
            <div th:if="${param.error}" class="executive-alert executive-alert-danger alert-dismissible fade show" role="alert">
                <span><i class="bi bi-exclamation-triangle-fill me-2"></i>Usuario o contraseña incorrectos.</span>
                <button type="button" class="btn-close" style="font-size: 0.65rem;" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${param.logout}" class="executive-alert executive-alert-success alert-dismissible fade show" role="alert">
                <span><i class="bi bi-check-circle-fill me-2"></i>Has cerrado sesión correctamente.</span>
                <button type="button" class="btn-close" style="font-size: 0.65rem;" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${success}" class="executive-alert executive-alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" style="font-size: 0.65rem;" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="executive-alert executive-alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" style="font-size: 0.65rem;" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="field-label">USUARIO O CORREO</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person leading-icon"></i>
                        <input type="text" class="executive-input" id="username" name="username"
                               placeholder="juan.garces028@gmail.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="field-label">CONTRASEÑA</label>
                    <div class="input-wrapper">
                        <i class="bi bi-lock leading-icon"></i>
                        <input type="password" class="executive-input" id="password" name="password"
                               placeholder="••••••••" required>
                        <button type="button" class="trailing-btn" onclick="togglePassword()" aria-label="Mostrar contraseña">
                            <i class="bi bi-eye-slash" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-metallic-emerald">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span>Iniciar Sesión</span>
                </button>
            </form>

            <div class="footer-badge">
                <i class="bi bi-shield-check" style="color: #198754;"></i>
                <span>Plataforma Cloud <strong>FarmaSIS</strong> © 2026</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            }
        }
    </script>
</body>

</html>
